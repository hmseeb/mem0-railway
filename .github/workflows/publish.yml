name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/mem0-api
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository_owner }}/mem0-dashboard

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build for the runner's own architecture first so the contract tests can
      # actually run the images. A multi-arch build cannot be loaded locally.
      - name: Build api image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: mem0-api:test
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build dashboard image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          load: true
          tags: mem0-dashboard:test
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Api contract test
        run: ./test/api_test.sh mem0-api:test

      - name: Dashboard contract test
        run: ./test/dashboard_test.sh mem0-dashboard:test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:latest
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      # mem0's own published image is arm64 only, which is exactly why this
      # check exists: a green build says nothing about where the image can run.
      - name: Published manifest test
        run: ./test/manifest_test.sh "$API_IMAGE:latest" "$DASHBOARD_IMAGE:latest"
